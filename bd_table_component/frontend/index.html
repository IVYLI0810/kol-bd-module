<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Table Component</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans KR', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }
        #root { width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
    /**
     * 最小化 Streamlit 组件通信库（兼容 streamlit-component-lib 协议）。
     * 用于让 iframe 内的表格能正确调用 Streamlit.setComponentValue，
     * 避免使用 components.v1.html 时消息无法被父页面消费的问题。
     */
    var Streamlit = {
        API_VERSION: 1,
        RENDER_EVENT: "streamlit:render",
        events: (function() {
            var listeners = {};
            return {
                addEventListener: function(type, fn) {
                    (listeners[type] = listeners[type] || []).push(fn);
                },
                dispatchEvent: function(event) {
                    var list = listeners[event.type] || [];
                    list.forEach(function(fn) { fn(event); });
                }
            };
        })(),
        registeredMessageListener: false,
        lastFrameHeight: null,

        setComponentReady: function() {
            if (!Streamlit.registeredMessageListener) {
                window.addEventListener("message", Streamlit.onMessageEvent);
                Streamlit.registeredMessageListener = true;
            }
            Streamlit.sendBackMsg("streamlit:componentReady", { apiVersion: Streamlit.API_VERSION });
        },

        setFrameHeight: function(height) {
            if (height === undefined) {
                height = document.body.scrollHeight;
            }
            if (height === Streamlit.lastFrameHeight) return;
            Streamlit.lastFrameHeight = height;
            Streamlit.sendBackMsg("streamlit:setFrameHeight", { height: height });
        },

        setComponentValue: function(value) {
            Streamlit.sendBackMsg("streamlit:setComponentValue", { value: value, dataType: "json" });
        },

        onMessageEvent: function(event) {
            var type = event.data && event.data["type"];
            if (type === Streamlit.RENDER_EVENT) {
                Streamlit.onRenderMessage(event.data);
            }
        },

        onRenderMessage: function(data) {
            var args = data["args"] || {};
            var event = new CustomEvent(Streamlit.RENDER_EVENT, {
                detail: { args: args, disabled: !!data["disabled"], theme: data["theme"] }
            });
            Streamlit.events.dispatchEvent(event);
        },

        sendBackMsg: function(type, data) {
            window.parent.postMessage(
                Object.assign({ isStreamlitMessage: true, type: type }, data),
                "*"
            );
        }
    };

    (function() {
        var root = document.getElementById("root");
        var selected = new Set();

        function sendValue(lastClicked, lastAction) {
            Streamlit.setComponentValue({
                selected: Array.from(selected),
                clicked: lastClicked,
                action: lastAction
            });
        }

        function toggleRow(cid) {
            if (selected.has(cid)) selected.delete(cid);
            else selected.add(cid);
            sendValue(null, null);
        }

        function selectAll(checked) {
            var rows = document.querySelectorAll(".bd-row");
            rows.forEach(function(row) {
                var cid = row.getAttribute("data-cid");
                var cb = row.querySelector(".bd-row-checkbox");
                if (checked) selected.add(cid);
                else selected.delete(cid);
                if (cb) cb.checked = checked;
            });
            sendValue(null, null);
        }

        function triggerAction(cid, type) {
            sendValue(null, { cid: cid, type: type, ts: Date.now() });
        }

        function attachListeners() {
            document.querySelectorAll(".bd-row").forEach(function(row) {
                row.addEventListener("click", function(e) {
                    if (e.target.tagName === "INPUT" ||
                        e.target.tagName === "A" ||
                        e.target.classList.contains("bd-action-btn")) {
                        return;
                    }
                    var cid = row.getAttribute("data-cid");
                    sendValue({ cid: cid, ts: Date.now() }, null);
                });
            });

            document.querySelectorAll(".bd-action-btn").forEach(function(btn) {
                btn.addEventListener("click", function(e) {
                    e.stopPropagation();
                    var cid = btn.getAttribute("data-cid");
                    var type = btn.getAttribute("data-action");
                    triggerAction(cid, type);
                });
            });

            var selectAllCb = document.getElementById("bd-select-all");
            if (selectAllCb) {
                selectAllCb.addEventListener("change", function(e) {
                    selectAll(e.target.checked);
                });
            }
        }

        function render(args) {
            var html = args.html || "";
            var selectedIds = args.selected_ids || [];
            selected = new Set(selectedIds);
            root.innerHTML = html;
            attachListeners();
            Streamlit.setFrameHeight();
        }

        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function(event) {
            render(event.detail.args);
        });

        // 通知 Streamlit 组件已就绪；父页面收到后才会发送 RENDER 事件。
        Streamlit.setComponentReady();
    })();
    </script>
</body>
</html>
